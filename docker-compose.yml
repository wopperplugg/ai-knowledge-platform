services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: "KnowledgeOps AI"
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://knowledge_ops:knowledge_ops@db:5432/knowledge_ops
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:4b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: knowledge_ops
      POSTGRES_USER: knowledge_ops
      POSTGRES_PASSWORD: knowledge_ops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_ops -d knowledge_ops"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
